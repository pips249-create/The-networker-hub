<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password – The Networker Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

<div id="hub-site-nav"></div>
<script src="js/site-nav.js?v=20260604" data-root="" data-page="auth"></script>

<main class="auth-main">
  <div class="auth-card">
    <h1>Forgot password</h1>
    <p class="auth-lede">Enter your email. If email delivery isn&rsquo;t set up yet, your reset link will appear on this page (valid for 1 hour).</p>

    <div id="auth-message" class="auth-message" role="alert"></div>
    <div id="dev-reset" class="auth-dev-link" hidden></div>

    <form id="forgot-form" novalidate>
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required placeholder="you@company.com">
      </div>
      <div class="auth-actions">
        <button type="submit" class="auth-submit" id="forgot-submit">Send reset link</button>
      </div>
    </form>

    <div class="auth-links">
      <a href="login.html">← Back to sign in</a>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
