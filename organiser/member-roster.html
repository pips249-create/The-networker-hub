<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>Membership – The Networker Hub</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var id = params.get('id') || params.get('organiserId') || '';
        var target = '/organiser/#memberships';
        if (id) target += '?membershipGroup=' + encodeURIComponent(id);
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Opening membership… <a href="/organiser/#memberships">Continue</a></p>
  </body>
</html>
