<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm your email – The Networker UK</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico?v=20260823uk3" sizes="any" />
    <link rel="icon" href="/assets/favicon.svg?v=20260823uk3" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png?v=20260823uk" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260823uk" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20260825banner1" />
    <link rel="stylesheet" href="../css/auth.css?v=20260727ux" />
    <link rel="stylesheet" href="../css/organiser-enable.css?v=20260709b" />
    <link rel="stylesheet" href="../css/hub-mobile.css?v=20260807nav2" />
  </head>
  <body class="auth-page auth-page--organiser-access">
    <div id="hub-site-nav"></div>
    <script src="../js/site-nav.js?v=20260825banner1" data-root="../" data-page="organiser"></script>

    <main class="auth-main auth-main--organiser-access">
      <div class="org-enable-shell">
        <div class="org-enable-layout">
          <section class="org-enable-panel">
            <div class="auth-card auth-card--organiser-enable">
              <header class="auth-welcome-head">
                <p class="auth-welcome-kicker">Almost there</p>
                <h1>Confirm your email</h1>
                <p class="auth-lede auth-lede--welcome" id="verify-email-lede">
                  We sent a 6-digit code to <strong id="verify-email-address">your email</strong>. Enter it below to
                  unlock your organiser dashboard.
                </p>
              </header>

              <div id="verify-email-status" class="auth-verify-status" hidden></div>
              <p id="verify-email-error" class="auth-error" hidden role="alert"></p>
              <p id="verify-email-dev" class="auth-dev-link" hidden></p>

              <form id="verify-email-form" class="auth-verify-form" novalidate>
                <div class="auth-field">
                  <label for="verify-email-code">Confirmation code</label>
                  <input
                    type="text"
                    id="verify-email-code"
                    name="code"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    placeholder="6-digit code"
                    required
                  />
                </div>
                <div class="auth-verify-actions">
                  <button type="submit" class="auth-primary-btn" id="verify-email-confirm">Confirm your email</button>
                </div>
              </form>

              <p class="auth-verify-resend-row">
                <button type="button" class="auth-text-btn" id="verify-email-resend">Resend code</button>
              </p>
              <a href="/organiser/" class="auth-primary-btn" id="verify-email-continue" hidden>
                Continue to organiser workspace
              </a>
            </div>
          </section>

          <aside class="org-enable-previews" aria-label="Preview of your organiser workspace">
            <p class="org-enable-previews-label">Waiting for you in your workspace</p>
            <div class="org-enable-preview-stack" aria-hidden="true">
              <figure class="org-enable-preview">
                <div class="org-enable-preview-chrome">
                  <span class="org-enable-preview-dots"><i></i><i></i><i></i></span>
                  <span class="org-enable-preview-title">Organiser workspace — Overview</span>
                </div>
                <div class="org-enable-preview-body org-enable-preview-body--dash">
                  <p class="org-enable-dash-kicker">Organiser workspace</p>
                  <h2 class="org-enable-dash-title">Overview</h2>
                  <div class="org-enable-dash-portals">
                    <div class="org-enable-dash-portal org-enable-dash-portal--events">
                      <strong>Manage My events</strong>
                      <span>3 upcoming · £420 revenue</span>
                    </div>
                    <div class="org-enable-dash-portal org-enable-dash-portal--business">
                      <strong>My business opportunities</strong>
                      <span>2 live listings · 5 enquiries</span>
                    </div>
                  </div>
                  <div class="org-enable-dash-stats">
                    <div class="org-enable-dash-stat">
                      <span class="org-enable-dash-stat-label">Events</span>
                      <span class="org-enable-dash-stat-value">3</span>
                    </div>
                    <div class="org-enable-dash-stat">
                      <span class="org-enable-dash-stat-label">Tickets sold</span>
                      <span class="org-enable-dash-stat-value">28</span>
                    </div>
                    <div class="org-enable-dash-stat">
                      <span class="org-enable-dash-stat-label">Revenue</span>
                      <span class="org-enable-dash-stat-value">£420</span>
                    </div>
                  </div>
                </div>
                <figcaption class="org-enable-preview-caption">Events, attendees, revenue &amp; payouts</figcaption>
              </figure>

              <figure class="org-enable-preview org-enable-preview--business">
                <div class="org-enable-preview-chrome">
                  <span class="org-enable-preview-dots"><i></i><i></i><i></i></span>
                  <span class="org-enable-preview-title">Business opportunities — List a listing</span>
                </div>
                <div class="org-enable-preview-body org-enable-preview-body--biz">
                  <p class="org-enable-biz-kicker">Business opportunities</p>
                  <h2 class="org-enable-biz-title">My business opportunities</h2>
                  <div class="org-enable-biz-stats">
                    <div class="org-enable-biz-stat">
                      <span class="org-enable-biz-stat-label">Live listings</span>
                      <span class="org-enable-biz-stat-value">2</span>
                    </div>
                    <div class="org-enable-biz-stat">
                      <span class="org-enable-biz-stat-label">Enquiries received</span>
                      <span class="org-enable-biz-stat-value">5</span>
                    </div>
                    <div class="org-enable-biz-stat">
                      <span class="org-enable-biz-stat-label">New enquiries</span>
                      <span class="org-enable-biz-stat-value">1</span>
                    </div>
                  </div>
                  <div class="org-enable-biz-pricing">
                    <p class="org-enable-biz-pricing-label">Standard listing</p>
                    <p class="org-enable-biz-pricing-amount">£25 <span>/ month + VAT</span></p>
                    <p class="org-enable-biz-pricing-note">List franchises, partnerships &amp; side hustles — respond to enquiries from your workspace.</p>
                  </div>
                </div>
                <figcaption class="org-enable-preview-caption">Listings, enquiries &amp; premium spotlight</figcaption>
              </figure>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="../js/organiser-verify-email.js?v=20260727code" defer></script>
  </body>
</html>
