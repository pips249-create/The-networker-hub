<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opportunity submitted – The Networker Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20260614" />
    <link rel="stylesheet" href="../css/organiser-event-edit.css?v=20260608c" />
    <link rel="stylesheet" href="../css/organiser-opportunity-edit.css?v=20260609" />
    <link rel="stylesheet" href="../css/hub-mobile.css?v=20260606" />
  </head>
  <body class="opportunities-page organiser-event-edit-page organiser-opportunity-edit-page">
    <div id="hub-site-nav"></div>
    <script src="../js/site-nav.js?v=20260710" data-root="../" data-page="opportunities"></script>

    <div class="ee-wrap" style="max-width: 640px; text-align: center; padding-top: 48px">
      <div class="ee-card" style="padding: 36px 28px">
        <p style="font-size: 40px; margin: 0 0 16px" aria-hidden="true">✓</p>
        <h1 class="ee-title" style="margin-bottom: 12px">Opportunity submitted</h1>
        <p class="ee-lead" id="oe-success-lede" style="margin-bottom: 24px">
          Thanks — your listing is live in the business opportunities directory.
        </p>
        <div class="ee-actions" style="justify-content: center; flex-wrap: wrap; gap: 10px">
          <a class="ee-btn ee-btn-gold" href="../opportunities/index.html" id="oe-view-listing">View opportunities</a>
          <a class="ee-btn ee-btn-outline" href="opportunity-edit.html" id="oe-add-another">List another</a>
        </div>
      </div>
    </div>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var id = params.get('id');
        var title = params.get('title');
        var lede = document.getElementById('oe-success-lede');
        var viewBtn = document.getElementById('oe-view-listing');
        if (lede && title) {
          lede.textContent =
            'Thanks — "' + title + '" is now live in the business opportunities directory.';
        }
        if (viewBtn && id) {
          viewBtn.href = '../opportunities/opportunity.html?id=' + encodeURIComponent(id);
          viewBtn.textContent = 'View your listing';
        }
      })();
    </script>
  </body>
</html>
