<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico?v=20260722fav2" sizes="any" />
    <link rel="icon" href="/assets/favicon.svg?v=20260722fav2" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png?v=20260722fav2" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260722fav2" />
    <title>Location &amp; access – Organiser – The Networker Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20260714cls" />
    <link rel="stylesheet" href="../css/hub-dashboard-layout.css?v=20260614" />
    <link rel="stylesheet" href="../css/fact-loader.css?v=20260613" />
    <link rel="stylesheet" href="../css/organiser-event-edit.css?v=20260722lock" />
    <link rel="stylesheet" href="../css/organiser-flow-tour.css?v=20260716layout" />
    <link rel="stylesheet" href="../css/hub-field-tip.css?v=20260716tips" />
    <link rel="stylesheet" href="../css/hubert-widget.css?v=20260612" />
    <link rel="stylesheet" href="../css/hub-mobile.css?v=20260714photo" />
  </head>
  <body class="organiser-event-edit-page">
    <div id="ee-page-loading" class="ee-page-loading" hidden role="status" aria-live="polite" aria-busy="false">
      <div class="ee-page-loading-card">
        <div class="ee-page-loading-spinner" aria-hidden="true"></div>
        <p class="ee-page-loading-text"><span class="ee-page-loading-label">Loading</span><span class="ee-page-loading-dots" aria-hidden="true"></span></p>
      </div>
    </div>
    <div id="hub-site-nav"></div>
    <script src="../js/site-nav.js?v=20260722b" data-root="../" data-page="organiser"></script>

    <div class="ee-wrap ee-wrap--wide">
      <header class="ee-page-head">
        <div class="ee-top-bar">
          <a class="ee-back" href="/organiser/#events-list" id="ee-back-link">← Back to My Events</a>
          <a class="ee-back ee-back-secondary" id="ee-back-details-link" href="#" hidden>← Event details</a>
          <button type="button" class="ee-hubert-help-btn" data-hubert-help>Hubert's help</button>
        </div>
        <div id="ee-wizard-mount"></div>
        <div class="ee-lock-banner" id="ee-lock-banner" hidden role="status"></div>
        <div class="ee-series-banner" id="ee-series-banner" hidden role="status"></div>
        <h1 class="ee-title" id="ee-page-title">Location &amp; access</h1>
        <p class="ee-lead" id="ee-page-lead">
          Choose in person or online, then add the venue or join details before ticket setup.
        </p>
      </header>
      <div id="ee-alert" class="ee-alert" hidden></div>

      <form id="ee-form" novalidate>
        <div class="ee-card" id="ee-card-location">
          <div class="ee-field">
            <p class="ee-label-block">Format</p>
            <div class="ee-mode-toggle" role="group" aria-label="Event format">
              <button type="button" class="ee-mode-btn" data-ee-format="in-person">In person</button>
              <button type="button" class="ee-mode-btn" data-ee-format="online">Online</button>
            </div>
          </div>

          <div class="ee-format-panel" id="ee-venue-block" data-format-panel="venue">
            <h3 class="ee-subheading" data-hub-tip="event-venue">Venue &amp; address</h3>
            <div class="ee-field">
              <label for="ee-venue">Venue name</label>
              <input type="text" id="ee-venue" placeholder="e.g. The Exchange" />
            </div>
            <div class="ee-field">
              <label for="ee-address1">Address line 1</label>
              <input type="text" id="ee-address1" placeholder="Street address" autocomplete="street-address" />
            </div>
            <div class="ee-row-2">
              <div class="ee-field">
                <label for="ee-city">City / town</label>
                <input type="text" id="ee-city" placeholder="e.g. Liverpool" autocomplete="address-level2" />
              </div>
              <div class="ee-field">
                <label for="ee-postcode">Postcode</label>
                <input type="text" id="ee-postcode" placeholder="e.g. L1 8JQ" autocomplete="postal-code" />
                <p class="ee-hint ee-field-error" id="ee-postcode-hint" hidden></p>
              </div>
            </div>
          </div>

          <div class="ee-format-panel" id="ee-online-block" data-format-panel="online">
            <h3 class="ee-subheading" data-hub-tip="event-online">Online access</h3>
            <div class="ee-field">
              <label for="ee-platform">Platform</label>
              <select id="ee-platform">
                <option value="">Select platform</option>
                <option>Zoom Meeting</option>
                <option>Zoom Webinar</option>
                <option>Microsoft Teams</option>
                <option>Google Meet</option>
                <option>Hopin</option>
                <option>Other</option>
              </select>
            </div>
            <div class="ee-field">
              <label for="ee-join-link">Meeting / join link <span class="ee-optional">(optional)</span></label>
              <input type="url" id="ee-join-link" placeholder="https://zoom.us/j/… or Teams link" />
            </div>
          </div>
        </div>

        <div class="ee-card ee-card-actions">
          <div class="ee-actions ee-actions--split">
            <button type="button" class="ee-btn ee-btn-outline" id="ee-save-draft">Save changes</button>
            <button type="submit" class="ee-btn ee-btn-gold" id="ee-submit">Continue to tickets →</button>
          </div>
          <p class="ee-hint ee-autodraft-status" id="ee-autodraft-status" aria-live="polite"></p>
          <p class="ee-hint ee-actions-note">Ticket types and pricing come on the next step.</p>
        </div>
      </form>
    </div>

    <script src="../js/organiser-embed-bootstrap.js?v=20260716perf" defer></script>
    <script src="../js/organiser-event-wizard.js?v=20260716loc" data-step="location" defer></script>
    <script src="../js/hub-organiser-actions.js?v=20260606" data-root="../" defer></script>
    <script src="../js/hubert-chat.js?v=20260612" defer></script>
    <script src="../js/hubert-organiser-guide.js?v=20260612" data-root="../" defer></script>
    <script src="../js/organiser-flow-tour.js?v=20260716loc" data-root="../" defer></script>
    <script src="../js/fact-loader.js?v=20260613" defer></script>
    <script src="../js/organiser-page-loading.js?v=20260714busy" defer></script>
    <script src="../js/postcode-outcode.js?v=20260716loc" defer></script>
    <script src="../js/organiser-field-tips.js?v=20260716tips" defer></script>
    <script src="../js/hub-field-tip.js?v=20260716tips" defer></script>
    <script src="../js/organiser-event-location.js?v=20260722lock" defer></script>
  </body>
</html>
