<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add bank details – The Networker Hub</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico?v=20260722fav2" sizes="any" />
    <link rel="icon" href="/assets/favicon.svg?v=20260722fav2" type="image/svg+xml" />
    <link rel="icon" href="/assets/favicon-32.png?v=20260722fav2" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=20260722fav2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20260728footer" />
    <link rel="stylesheet" href="../css/auth.css?v=20260709h" />
    <link rel="stylesheet" href="../css/hub-mobile.css?v=20260728footer" />
  </head>
  <body class="auth-page payment-setup-page">
    <main class="auth-main payment-setup-main">
      <div class="payment-setup-shell">
        <div class="payment-setup-hero" aria-hidden="true">
          <div class="payment-setup-brand payment-setup-brand--hub">
            <a class="nav-logo payment-setup-hub-brand" href="../" aria-label="The Networker Hub home">
              <img
                src="../assets/logo-nav-transparent.png?v=20260709h"
                alt="The Networker Hub"
                width="714"
                height="193"
                decoding="async"
              />
            </a>
          </div>

          <div class="payment-setup-bridge">
            <div class="payment-setup-bridge-track"></div>
            <span class="payment-setup-bridge-dot"></span>
            <span class="payment-setup-bridge-dot"></span>
            <span class="payment-setup-bridge-dot"></span>
          </div>

          <div class="payment-setup-brand payment-setup-brand--stripe">
            <img
              class="payment-setup-stripe-logo"
              src="../assets/stripe-wordmark-transparent.png"
              alt="Stripe"
              width="345"
              height="144"
            />
          </div>
        </div>

        <div class="payment-setup-copy">
          <p class="payment-setup-kicker">Secure payouts</p>
          <h1>Opening bank details setup</h1>
          <p class="payment-setup-status" id="payment-setup-status" role="status">
            One moment — we’re securely connecting you to Stripe.
          </p>
          <p class="payment-setup-hint" id="payment-setup-hint">
            Complete every step on Stripe (identity and bank account). You’ll return here when finished.
          </p>

          <p id="payment-setup-error" class="auth-error" hidden role="alert"></p>

          <p class="auth-form-foot">
            <a href="/organiser/#events-revenue" class="auth-secondary-link">← Back to organiser workspace</a>
          </p>
        </div>
      </div>
    </main>
    <script src="../js/organiser-payment-setup-launch.js?v=20260708i" defer></script>
  </body>
</html>
