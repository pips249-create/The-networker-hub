<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – The Networker Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#faf6fe', 100: '#ebe0f0', 500: '#9a7aa8', 700: '#5b2f99', 900: '#2d1b4e' },
          },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

  <div id="admin-gate" class="min-h-screen flex items-center justify-center p-6">
    <p class="text-slate-500" id="admin-gate-msg">Verifying admin access…</p>
  </div>

  <div id="admin-shell" class="hidden min-h-screen">
    <aside class="fixed inset-y-0 left-0 z-40 w-64 bg-brand-900 text-white flex flex-col shadow-xl">
      <div class="p-5 border-b border-white/10">
        <a href="../index.html" class="text-xs uppercase tracking-widest text-brand-100/80 hover:text-white">← Hub</a>
        <h1 class="mt-2 text-lg font-bold tracking-tight">Networker Admin</h1>
        <p class="text-xs text-brand-100/70 mt-1" id="sidebar-user">—</p>
      </div>
      <nav class="flex-1 p-3 space-y-1" aria-label="Admin">
        <a href="#dashboard" data-route="dashboard" class="admin-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition">
          <span aria-hidden="true">◈</span> Overview
        </a>
        <a href="#users" data-route="users" class="admin-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition">
          <span aria-hidden="true">◎</span> Users &amp; Accounts
        </a>
        <a href="#event-health" data-route="event-health" class="admin-nav-link relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition">
          <span aria-hidden="true">⚠</span> Event data issues
          <span id="admin-health-badge" class="hidden ml-auto min-w-[1.25rem] h-5 px-1.5 rounded-full bg-red-500 text-white text-[10px] font-bold leading-5 text-center" aria-label="Events needing fixes">0</span>
        </a>
        <a href="#moderation" data-route="moderation" class="admin-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition">
          <span aria-hidden="true">▣</span> Content Moderation
        </a>
        <a href="#financials" data-route="financials" class="admin-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition">
          <span aria-hidden="true">£</span> Financial Hub
        </a>
        <a href="#sponsorship" data-route="sponsorship" class="admin-nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-white/80 hover:bg-white/10 hover:text-white transition">
          <span aria-hidden="true">★</span> Sponsorship &amp; Ads
        </a>
      </nav>
      <div class="p-4 border-t border-white/10">
        <button type="button" id="admin-signout" class="w-full text-left text-sm text-white/70 hover:text-white px-3 py-2 rounded-lg hover:bg-white/10">Sign out</button>
      </div>
    </aside>

    <main class="min-h-screen pl-64 relative z-10">
      <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200 px-6 py-4 flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold text-brand-900" id="page-title">Overview Dashboard</h2>
          <p class="text-sm text-slate-500" id="page-subtitle">System-wide performance health check</p>
        </div>
        <span class="inline-flex items-center gap-2 text-xs font-semibold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live
        </span>
      </header>
      <div id="admin-main" class="p-6 max-w-7xl mx-auto"></div>
    </main>
  </div>

  <div id="user-drawer" class="hidden fixed inset-0 z-50" aria-hidden="true">
    <div class="absolute inset-0 bg-slate-900/40" data-close-drawer></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-5 border-b border-slate-200 flex justify-between items-start">
        <div>
          <h3 class="font-bold text-lg" id="drawer-name">User</h3>
          <p class="text-sm text-slate-500" id="drawer-email">—</p>
        </div>
        <button type="button" class="text-slate-400 hover:text-slate-700 text-2xl leading-none" data-close-drawer aria-label="Close">&times;</button>
      </div>
      <div class="p-5 flex-1 overflow-y-auto space-y-6" id="drawer-body"></div>
    </div>
  </div>

  <script src="../js/admin-app.js?v=20260628c"></script>
</body>
</html>
