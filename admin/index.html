<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel – The Networker Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#faf6fe', 100: '#ebe0f0', 500: '#9a7aa8', 700: '#5b2f99', 900: '#2d1b4e' },
          },
          fontFamily: { sans: ['DM Sans', 'system-ui', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/hub.css?v=20260609b">
  <link rel="stylesheet" href="../css/hub-mobile.css?v=20260605">
  <link rel="stylesheet" href="../css/admin-console.css?v=20260621">
</head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">

  <div id="hub-site-nav"></div>
  <script src="../js/site-nav.js?v=20260712" data-root="../" data-page="admin"></script>

  <div id="admin-gate" class="min-h-[50vh] flex items-center justify-center p-6">
    <p class="text-slate-500" id="admin-gate-msg">Verifying admin access…</p>
  </div>

  <div id="admin-shell" class="admin-shell hidden">
    <div id="admin-sidebar-backdrop" class="hidden fixed inset-0 z-40 bg-slate-900/40 lg:hidden" aria-hidden="true"></div>
    <aside id="admin-sidebar" class="bg-brand-900 text-white shadow-xl" aria-label="Command Center navigation">
      <div class="admin-sidebar-head">
        <h1 class="text-base font-bold tracking-tight">Command Center</h1>
        <p class="text-[11px] text-brand-100/70 mt-0.5 truncate" id="sidebar-user">—</p>
      </div>
      <nav class="flex-1 admin-sidebar-nav overflow-y-auto" aria-label="Admin">
        <a href="#dashboard" data-route="dashboard" class="admin-nav-link">Overview</a>

        <span class="admin-nav-group">Platform</span>
        <a href="#system" data-route="system" class="admin-nav-link">System</a>
        <a href="#accounts/users" data-route="accounts" class="admin-nav-link">Accounts</a>

        <span class="admin-nav-group">Listings</span>
        <a href="#cleanup/groups" data-route="cleanup" class="admin-nav-link relative">
          Listing cleanup
          <span id="admin-health-badge" class="hidden admin-nav-badge" aria-label="Events needing fixes">0</span>
        </a>
        <a href="#moderation" data-route="moderation" class="admin-nav-link">Moderation</a>

        <span class="admin-nav-group">Revenue</span>
        <a href="#financials" data-route="financials" class="admin-nav-link">Financials</a>
        <a href="#featured" data-route="featured" class="admin-nav-link">Featured</a>
        <a href="#sponsorship" data-route="sponsorship" class="admin-nav-link">Sponsorship</a>

        <span class="admin-nav-group">Comms</span>
        <a href="#email/campaigns" data-route="email" class="admin-nav-link">Email</a>
      </nav>
      <div class="admin-sidebar-foot">
        <button type="button" id="admin-signout" class="admin-nav-link admin-nav-link--button w-full text-left">Sign out</button>
      </div>
    </aside>

    <div class="admin-main-column">
      <header class="admin-page-header px-4 lg:px-5 py-2.5 flex items-center justify-between gap-3">
        <div class="flex items-start gap-3 min-w-0 flex-1">
          <button type="button" id="admin-nav-toggle" class="lg:hidden shrink-0 mt-0.5 inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-200 bg-white text-brand-900 hover:bg-slate-50" aria-controls="admin-sidebar" aria-expanded="false" aria-label="Open Command Center menu">
            <span aria-hidden="true">☰</span>
          </button>
          <div class="min-w-0">
            <h2 class="text-base lg:text-lg font-bold text-brand-900 truncate" id="page-title">Overview</h2>
            <p class="text-xs text-slate-500 line-clamp-2 admin-page-subtitle" id="page-subtitle">Supabase counts, alerts, and recent genuine platform activity</p>
          </div>
        </div>
        <span id="admin-data-badge" class="hidden sm:inline-flex shrink-0 items-center text-[11px] font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full" title="Counts and lists load from Supabase when you open each page">
          Supabase
        </span>
      </header>
      <div id="admin-main" class="p-3 lg:p-5 max-w-7xl mx-auto min-w-0 w-full"></div>
    </div>
  </div>

  <div id="user-drawer" class="hidden fixed inset-0 z-50" aria-hidden="true">
    <div class="absolute inset-0 bg-slate-900/40" data-close-drawer></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col">
      <div class="p-5 border-b border-slate-200 flex justify-between items-start">
        <div>
          <h3 class="font-bold text-lg" id="drawer-name">User</h3>
          <p class="text-sm text-slate-500" id="drawer-email">—</p>
        </div>
        <button type="button" class="text-slate-400 hover:text-slate-700 text-2xl leading-none" data-close-drawer aria-label="Close">&times;</button>
      </div>
      <div class="p-5 flex-1 overflow-y-auto space-y-6" id="drawer-body"></div>
    </div>
  </div>

    <script src="../js/organiser-image-upload.js?v=20260614"></script>
    <script src="../js/cms-sponsor-fields.js?v=20260609c"></script>
    <script src="../js/admin-app.js?v=20260626"></script>
</body>
</html>
