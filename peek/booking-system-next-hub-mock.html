<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mock: Hub tickets - The Networker UK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20261016signin1" />
    <link rel="stylesheet" href="../css/organiser-event-edit.css?v=20261021eb2" />
    <link rel="stylesheet" href="booking-flow-mock.css" />
  </head>
  <body class="organiser-event-edit-page bf-mock">
    <div class="ee-wrap bf-wrap">
      <a class="ee-back" href="booking-system-first-choice-mock.html">← Back</a>
      <header class="bf-head">
        <p class="bf-kicker">Friday breakfast networking</p>
        <h1 class="bf-title">How should people get in?</h1>
        <p class="bf-lede">Same hub ticket flow you already use. No connect step.</p>
      </header>
      <nav class="bf-progress" aria-label="Setup progress">
        <span class="bf-progress-step is-done">1. Book where</span>
        <span class="bf-progress-step is-current">2. Tickets</span>
      </nav>
      <div class="bf-choices">
        <button type="button" class="bf-choice is-active" aria-selected="true">
          <span class="bf-choice-main">
            <strong>General ticketing</strong>
            <span>Anyone can book. Then add ticket prices.</span>
          </span>
        </button>
        <button type="button" class="bf-choice" aria-selected="false">
          <span class="bf-choice-main">
            <strong>Application based</strong>
            <span>You approve each seat.</span>
          </span>
        </button>
      </div>
      <div class="bf-actions">
        <a class="ee-btn ee-btn-outline" href="booking-system-first-choice-mock.html">Back</a>
        <button type="button" class="ee-btn ee-btn-gold">Continue to tickets</button>
      </div>
    </div>
  </body>
