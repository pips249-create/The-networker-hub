<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Mock: Where do people book? - The Networker UK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20261016signin1" />
    <link rel="stylesheet" href="../css/organiser-event-edit.css?v=20261021eb2" />
    <link rel="stylesheet" href="booking-flow-mock.css" />
  </head>
  <body class="organiser-event-edit-page bf-mock">
    <div class="ee-wrap bf-wrap">
      <a class="ee-back" href="/organiser/#events-list">← My Events</a>

      <header class="bf-head">
        <p class="bf-kicker">Friday breakfast networking</p>
        <h1 class="bf-title">Where do people book?</h1>
        <p class="bf-lede">One choice for this event. You can change it next time.</p>
      </header>

      <nav class="bf-progress" aria-label="Setup progress">
        <span class="bf-progress-step is-current">1. Book where</span>
        <span class="bf-progress-step">2. Connect</span>
        <span class="bf-progress-step">3. Check listing</span>
      </nav>

      <div class="bf-choices" role="listbox" aria-label="Booking system">
        <button type="button" class="bf-choice is-active" data-next="hub" role="option" aria-selected="true">
          <span class="bf-choice-main">
            <strong>The Networker UK</strong>
            <span>Sell tickets here. Reviews and attendees built in.</span>
          </span>
          <span class="bf-choice-tag">Easiest</span>
        </button>

        <button type="button" class="bf-choice" data-next="eventbrite" role="option" aria-selected="false">
          <span class="bf-choice-main">
            <strong>
              <img src="../assets/connected-providers/eventbrite.svg" alt="" width="20" height="20" />
              Eventbrite
            </strong>
            <span>Keep Eventbrite checkout. Get attendees and verified reviews here.</span>
          </span>
        </button>

        <button type="button" class="bf-choice" data-next="ticket_tailor" role="option" aria-selected="false">
          <span class="bf-choice-main">
            <strong>Ticket Tailor</strong>
            <span>Keep Ticket Tailor checkout. Get attendees and verified reviews here.</span>
          </span>
        </button>

        <button type="button" class="bf-choice" data-next="own_site" role="option" aria-selected="false">
          <span class="bf-choice-main">
            <strong>My own website</strong>
            <span>Buyers pay on your site. Sync attendees and verified reviews here.</span>
          </span>
        </button>

        <button type="button" class="bf-choice bf-choice--quiet" data-next="link_out" role="option" aria-selected="false">
          <span class="bf-choice-main">
            <strong>Just a booking link</strong>
            <span>Free redirect only. No attendees. No verified reviews.</span>
          </span>
        </button>
      </div>

      <div class="bf-actions">
        <button type="button" class="ee-btn ee-btn-gold" id="bf-continue">Continue</button>
      </div>
    </div>

    <script>
      var selected = 'hub';
      document.querySelectorAll('.bf-choice').forEach(function (card) {
        card.addEventListener('click', function () {
          document.querySelectorAll('.bf-choice').forEach(function (c) {
            c.classList.remove('is-active');
            c.setAttribute('aria-selected', 'false');
          });
          card.classList.add('is-active');
          card.setAttribute('aria-selected', 'true');
          selected = card.getAttribute('data-next') || 'hub';
        });
      });
      document.getElementById('bf-continue').addEventListener('click', function () {
        var map = {
          hub: 'booking-system-next-hub-mock.html',
          eventbrite: 'booking-system-next-eventbrite-mock.html',
          ticket_tailor: 'booking-system-next-eventbrite-mock.html?provider=ticket_tailor',
          own_site: 'booking-system-next-eventbrite-mock.html?provider=own_site',
          link_out: 'booking-system-next-link-out-mock.html',
        };
        location.href = map[selected] || map.hub;
      });
    </script>
  </body>
</html>
