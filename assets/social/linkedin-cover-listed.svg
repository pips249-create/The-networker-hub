  <text x="72" y="300" fill="#ebe0f0" font-family="Arial, Helvetica, sans-serif" font-size="26">UK networking events · Find us in the directory</text>
  <rect x="1180" y="98" width="320" height="200" rx="18" fill="#f5f0e8" opacity="0.95"/>
  <text x="1340" y="180" text-anchor="middle" fill="#1c2040" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">DIRECTORY LISTING</text>
  <text x="1340" y="230" text-anchor="middle" fill="#9a7aa8" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">On the Hub</text>
