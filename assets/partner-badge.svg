<svg xmlns="http://www.w3.org/2000/svg" width="220" height="88" viewBox="0 0 220 88" role="img" aria-label="Listed on The Networker Hub">
  <title>Listed on The Networker Hub</title>
  <rect width="220" height="88" rx="10" fill="#0f2744"/>
  <rect x="1" y="1" width="218" height="86" rx="9" fill="none" stroke="#c9a84c" stroke-opacity="0.55"/>
  <text x="110" y="18" text-anchor="middle" fill="#f0dfa0" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="700" letter-spacing="0.14em">LISTED ON</text>
  <!-- Inlined Hub wordmark (external refs break when SVG is used as &lt;img&gt;) -->
  <g transform="translate(33.5, 22) scale(0.45)">
    <text x="170" y="28" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f5f0e8">The</text>
    <text x="32" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#c299d1">Net</text>
    <text x="119" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#c299d1">w</text>
    <circle cx="176" cy="72" r="11" fill="#faf6ee" stroke="#c299d1" stroke-width="2.5"/>
    <circle cx="176" cy="72" r="17" fill="none" stroke="#c299d1" stroke-width="2"/>
    <text x="193" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#c299d1">rker</text>
    <text x="170" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f5f0e8">Hub</text>
  </g>
</svg>
