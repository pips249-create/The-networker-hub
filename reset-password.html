<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password – The Networker Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub.css?v=20260730">
<link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/hub-mobile.css?v=20260730" />

</head>
<body class="auth-page">

<div id="hub-site-nav"></div>
<script src="js/site-nav.js?v=20260710f" data-root="" data-page="auth"></script>

<main class="auth-main">
  <div class="auth-card">
    <h1>Set new password</h1>
    <p class="auth-lede">Choose a new password (at least 8 characters).</p>

    <div id="auth-message" class="auth-message" role="alert"></div>

    <form id="reset-form" novalidate>
      <div class="auth-field">
        <label for="password">New password</label>
        <div class="password-input-wrap">
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="auth-field">
        <label for="password2">Confirm password</label>
        <div class="password-input-wrap">
          <input type="password" id="password2" name="password2" autocomplete="new-password" required minlength="8">
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>
      <div class="auth-actions">
        <button type="submit" class="auth-submit" id="reset-submit">Update password</button>
      </div>
    </form>

    <div class="auth-links">
      <a href="login.html">← Back to sign in</a>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
