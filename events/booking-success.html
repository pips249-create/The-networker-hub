<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Booking confirmed – The Networker Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/hub.css?v=20260627" />
    <link rel="stylesheet" href="../css/hub-mobile.css?v=20260627" />
    <style>
      .booking-success-shell {
        max-width: 560px;
        margin: 48px auto 80px;
        padding: 0 20px;
        text-align: center;
      }
      .booking-success-card {
        background: #fff;
        border: 1px solid var(--border-soft);
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 8px 28px rgba(45, 38, 54, 0.07);
      }
      .booking-success-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: var(--lavender-light);
        color: var(--lavender-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
      }
      .booking-success-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 24px;
      }
      .booking-success-actions a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 11px 18px;
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
      }
      .booking-success-primary {
        background: var(--lavender-deep);
        color: #fff;
      }
      .booking-success-secondary {
        border: 1px solid var(--border-soft);
        color: var(--charcoal);
        background: #fff;
      }
      .booking-success-status {
        margin-top: 16px;
        font-size: 14px;
        color: var(--text-muted);
      }
      .booking-success-status.is-error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <div id="hub-site-nav"></div>
    <script src="../js/site-nav.js?v=20260710" data-root="../" data-page="events"></script>

    <main class="booking-success-shell">
      <div class="booking-success-card">
        <div class="booking-success-icon" aria-hidden="true">✓</div>
        <h1>Booking confirmed</h1>
        <p id="booking-success-lead">Finalising your ticket…</p>
        <p class="booking-success-status" id="booking-success-status" role="status"></p>
        <div class="booking-success-actions" id="booking-success-actions" hidden>
          <a class="booking-success-primary" id="booking-success-account" href="/account/index.html">View my tickets</a>
          <a class="booking-success-secondary" id="booking-success-events" href="/events/">Browse more events</a>
        </div>
      </div>
    </main>

    <script src="../js/booking-success.js?v=20260609g"></script>
  </body>
</html>
