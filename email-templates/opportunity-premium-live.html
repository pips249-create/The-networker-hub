<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium placement active</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
    body, table, td, p, a { margin:0; padding:0; border:0; font-size:100%; font:inherit; vertical-align:top; }
    img { border:0; display:block; max-width:100%; height:auto; }
    body { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; background-color:#e8ecf5; }
    table { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
    @media only screen and (max-width:600px) {
      .email-wrapper { width:100% !important; }
      .hero-title { font-size:22px !important; line-height:1.2 !important; }
      .mobile-pad { padding-left:20px !important; padding-right:20px !important; }
      .mobile-header-pad { padding-left:20px !important; padding-right:20px !important; }
      .email-cta a { display:block !important; width:100% !important; box-sizing:border-box !important; text-align:center !important; margin-bottom:10px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#e8ecf5;font-family:'DM Sans',system-ui,sans-serif;">
<!-- hub-email-layout-v2 -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#e8ecf5;">
  <tr>
    <td align="center" style="padding:32px 16px 56px;">
      <table class="email-wrapper" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(28,32,64,0.12);">
        <tr>
          <td class="mobile-header-pad" style="background:#f5f0e8;padding:28px 40px 0;text-align:center;">
            <a href="{{site_url}}/" style="text-decoration:none;display:inline-block;">
              <img src="{{logo_url}}" alt="The Networker Hub" width="180" style="height:auto;display:inline-block;margin:0 auto;border:0;max-width:180px;width:100%;">
            </a>
          </td>
        </tr>
        <tr>
          <td style="background:#f5f0e8;padding:0;text-align:center;">
            <div style="line-height:0;font-size:0;margin-top:8px;">
              <svg viewBox="0 0 600 40" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:40px;">
                <path d="M0,24 C150,46 450,4 600,24 L600,40 L0,40 Z" fill="#ffffff"/>
              </svg>
            </div>
          </td>
        </tr>
        {{sponsor_row}}
        <tr>
          <td class="mobile-pad" style="padding:28px 40px 16px;text-align:center;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 auto 16px;">
              <tr><td style="width:52px;height:52px;background:#fff4d6;border-radius:50%;text-align:center;vertical-align:middle;font-size:22px;color:#b8860b;line-height:52px;">&#9733;</td></tr>
            </table>
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:10px;font-weight:700;color:#b8860b;text-transform:uppercase;letter-spacing:3px;margin:0 0 8px;">Premium active</p>
            <h1 class="hero-title" style="font-family:'DM Sans',system-ui,sans-serif;font-size:26px;font-weight:600;color:#1c2040;margin:0 0 10px;line-height:1.15;">Premium placement is live</h1>
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.7;color:#736b6e;margin:0;">Hi {{owner_name}}, <strong style="color:#1c2040;">{{opportunity_title}}</strong> now has premium spotlight placement on the business opportunities directory.</p>
          </td>
        </tr><tr>
          <td class="mobile-pad email-cta" style="padding:0 40px 28px;text-align:center;"><a href="{{opportunity_url}}" style="display:inline-block;text-align:center;padding:12px 28px;background:#4aa8f0;border-radius:999px;color:#ffffff;font-size:13px;font-weight:700;text-decoration:none;margin:0 6px 10px;">View listing &rarr;</a><a href="{{dashboard_url}}" style="display:inline-block;text-align:center;padding:12px 28px;background:#1c2040;border-radius:999px;color:#ffffff;font-size:13px;font-weight:700;text-decoration:none;margin:0 6px 10px;">Open dashboard</a></td>
        </tr>
        <tr>
          <td class="mobile-pad" style="background:#1c2040;padding:28px 40px 40px;text-align:center;border-radius:0 0 20px 20px;">
            <a href="{{site_url}}/" style="text-decoration:none;display:inline-block;">
              <img src="{{logo_footer_url}}" alt="The Networker Hub" width="140" style="height:auto;display:inline-block;margin:0 auto 16px;border:0;max-width:140px;">
            </a>
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:12px;font-weight:600;color:#ffffff;margin:0 0 8px;">The Networker Hub</p>
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:11px;font-weight:400;color:rgba(255,255,255,0.55);margin:0;">
              <a href="{{privacy_url}}" style="color:#4aa8f0;text-decoration:none;">Privacy</a>
              &nbsp;&middot;&nbsp;
              <a href="{{terms_url}}" style="color:#4aa8f0;text-decoration:none;">Terms</a>
              &nbsp;&middot;&nbsp;
              <a href="{{contact_url}}" style="color:#4aa8f0;text-decoration:none;">Contact</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
