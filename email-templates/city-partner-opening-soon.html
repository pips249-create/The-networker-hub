<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Partner opening soon</title>
  <style>
    body, table, td, p, a { margin:0; padding:0; border:0; font-size:100%; font:inherit; vertical-align:top; }
    img { border:0; display:block; max-width:100%; height:auto; }
    body { background-color:#e8ecf5; font-family:'DM Sans',system-ui,sans-serif; }
    table { border-collapse:collapse; }
  </style>
</head>
<body style="margin:0;padding:0;background:#e8ecf5;">
<!-- hub-email-layout-v2 -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#e8ecf5;">
  <tr>
    <td align="center" style="padding:32px 16px 56px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;">
        <tr>
          <td style="background:#f5f0e8;padding:28px 40px 0;text-align:center;">
            <a href="{{site_url}}/"><img src="{{logo_url}}" alt="The Networker Hub" width="240" style="height:auto;margin:0 auto;border:0;max-width:240px;width:100%;"></a>
          </td>
        </tr>
        {{sponsor_row}}
        <tr>
          <td style="padding:28px 40px 16px;text-align:center;">
            <p style="font-size:16px;font-weight:700;color:#6d5ce8;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 8px;">Opening soon</p>
            <h1 style="font-size:28px;font-weight:600;color:#1c2040;margin:0 0 10px;">{{city_name}} opens {{available_from}}</h1>
            <p style="font-size:16px;line-height:1.7;color:#635c5e;margin:0;">Hi {{contact_name}}, you joined the waitlist for <strong style="color:#1c2040;">{{city_name}}</strong>. The current partner has given notice — checkout should open on <strong style="color:#1c2040;">{{available_from}}</strong>. We will email you again the moment the slot is free.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px 28px;text-align:center;">
            <a href="{{advertising_url}}" style="display:inline-block;padding:14px 32px;background:#1c2040;border-radius:999px;color:#ffffff;font-size:16px;font-weight:700;text-decoration:none;">View availability &rarr;</a>
          </td>
        </tr>
        <tr>
          <td style="background:#452d5c;padding:28px 40px 40px;text-align:center;">
            <img src="{{logo_footer_url}}" alt="The Networker Hub" width="168" style="height:auto;margin:0 auto 12px;border:0;max-width:168px;width:100%;">
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
