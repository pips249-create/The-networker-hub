<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introduction accepted</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');
    body, table, td, p, a { margin:0; padding:0; border:0; font-size:100%; font:inherit; vertical-align:top; }
    body { -webkit-text-size-adjust:100%; background-color:#e8ecf5; }
    table { border-collapse:collapse; }
    @media only screen and (max-width:600px) {
      .email-wrapper { width:100% !important; max-width:100% !important; border-radius:0 !important; }
      .mobile-pad { padding-left:16px !important; padding-right:16px !important; }
      .hero-title { font-size:24px !important; }
      .email-cta a { display:block !important; width:100% !important; box-sizing:border-box !important; text-align:center !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#e8ecf5;font-family:'DM Sans',system-ui,sans-serif;">
<!-- hub-email-layout-v3-purple-hubert-intro -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#e8ecf5;">
  <tr>
    <td align="center" style="padding:32px 16px 56px;">
      <table class="email-wrapper" role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(28,32,64,0.12);">
        <tr>
          <td style="background:#f5f0e8;padding:28px 40px 0;text-align:center;">
            <a href="{{site_url}}/" style="text-decoration:none;display:inline-block;">
              <img src="{{logo_url}}" alt="The Networker UK" width="240" style="height:auto;display:inline-block;margin:0 auto;border:0;max-width:240px;width:100%;">
            </a>
          </td>
        </tr>
        {{sponsor_row}}
        <tr>
          <td class="mobile-pad" style="padding:28px 40px 12px;text-align:center;">
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:14px;font-weight:700;color:#b8860b;text-transform:uppercase;letter-spacing:0.5px;margin:0 0 8px;">Hubert</p>
            <h1 class="hero-title" style="font-family:'DM Sans',system-ui,sans-serif;font-size:26px;font-weight:600;color:#452d5c;margin:0 0 10px;line-height:1.2;">{{counterpart_name}} said yes</h1>
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.7;color:#635c5e;margin:0;">Hi {{user_name}}, I’ve opened your introduction on the Hub. Contact details stay private — continue the conversation in Meet people.</p>
          </td>
        </tr>
        <tr>
          <td class="mobile-pad" style="padding:8px 40px 20px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f4fb;border-radius:16px;">
              <tr>
                <td style="padding:18px 22px;">
                  <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:13px;font-weight:700;color:#7a7580;text-transform:uppercase;letter-spacing:0.4px;margin:0 0 6px;">Topic</p>
                  <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.55;color:#452d5c;margin:0;">{{topic}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td class="mobile-pad email-cta" style="padding:4px 40px 28px;text-align:center;">
            <a href="{{thread_url}}" style="display:inline-block;background:#452d5c;color:#ffffff;font-family:'DM Sans',system-ui,sans-serif;font-size:16px;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:999px;">Open intro thread</a>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 40px 28px;text-align:center;border-top:1px solid #eee8f2;">
            <p style="font-family:'DM Sans',system-ui,sans-serif;font-size:12px;color:#8a8490;margin:0 0 8px;"><a href="{{unsubscribe_url}}" style="color:#8a8490;">Email preferences</a> · <a href="{{privacy_url}}" style="color:#8a8490;">Privacy</a></p>
            <img src="{{logo_footer_url}}" alt="" width="120" style="margin:0 auto;opacity:0.7;">
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
