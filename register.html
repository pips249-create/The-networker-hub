<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account – The Networker Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/hub.css?v=20260610" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body class="auth-page">
    <div id="hub-site-nav"></div>
    <script src="js/site-nav.js?v=20260612" data-root="" data-page="auth"></script>

    <main class="auth-main">
      <div class="auth-card">
        <h1>Create account</h1>
        <p class="auth-lede">
          Join The Networker Hub — your details are saved securely and linked to your account in our
          database.
        </p>

        <div id="auth-message" class="auth-message" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="auth-field">
            <label for="name">Full name <span class="auth-optional">(optional)</span></label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name" />
          </div>
          <div class="auth-field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              placeholder="you@company.com"
            />
          </div>
          <div class="auth-field">
            <label for="password">Password</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                required
                minlength="8"
                placeholder="At least 8 characters"
              />
              <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                Show
              </button>
            </div>
          </div>
          <div class="auth-field">
            <label for="password2">Confirm password</label>
            <div class="password-input-wrap">
              <input
                type="password"
                id="password2"
                name="password2"
                autocomplete="new-password"
                required
                minlength="8"
                placeholder="Repeat your password"
              />
              <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                Show
              </button>
            </div>
          </div>
          <div class="auth-actions">
            <button type="submit" class="auth-submit" id="register-submit">Create account</button>
          </div>
        </form>

        <div class="auth-links">
          <a href="login.html" id="register-signin-link">Already have an account? Sign in</a>
          <a href="events/index.html">← Back to events</a>
        </div>
      </div>
    </main>

    <script src="js/auth.js?v=20260623"></script>
  </body>
</html>
