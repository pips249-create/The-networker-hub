<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accept Referral Partner Terms – The Networker UK</title>
<meta name="description" content="Confirm acceptance of Referral Partner Terms for The Networker UK.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/hub.css?v=20260909listmenu1">
<link rel="stylesheet" href="/css/content-page.css?v=20260711e">
<link rel="stylesheet" href="/css/partner-programme.css?v=20260917terms1">
<link rel="stylesheet" href="/css/hub-mobile.css?v=20260909listmenu1">
</head>
<body class="partner-programme-page partner-accept-terms-page">

<div id="hub-site-nav"></div>
<script src="/js/site-nav.js?v=20260922dash1" data-root="/" data-page="partners"></script>

<main class="content-page-main partner-accept-main">
  <div class="partner-accept-wrap">
    <h1>Accept Referral Partner Terms</h1>
    <p class="partner-accept-lede">
      Use the email address on your invite. After accepting, you can use your partner hub and tracking links.
    </p>

    <form id="partner-accept-form" class="partner-enquire-form" novalidate>
      <div class="partner-enquire-field">
        <label for="partner-accept-code">Partner code</label>
        <input type="text" id="partner-accept-code" name="code" autocomplete="off" required maxlength="32" class="partner-accept-code-input">
      </div>
      <div class="partner-enquire-field">
        <label for="partner-accept-email">Email address</label>
        <input type="email" id="partner-accept-email" name="email" autocomplete="email" required maxlength="254">
      </div>
      <div class="partner-enquire-field partner-accept-checkbox">
        <label class="partner-accept-check-label">
          <input type="checkbox" id="partner-accept-agree" name="agreedToTerms" required>
          <span>I have read and agree to the <a href="/partners/terms" target="_blank" rel="noopener">Referral Partner Terms</a> (version 2026-09-17).</span>
        </label>
      </div>
      <p id="partner-accept-status" class="partner-enquire-status" hidden role="status"></p>
      <div class="partner-enquire-actions">
        <button type="submit" class="partner-programme-btn partner-programme-btn--solid">Accept and continue</button>
      </div>
    </form>

    <p class="partner-enquire-alt">
      Questions? <a href="mailto:partnerships@thenetworkeruk.com">partnerships@thenetworkeruk.com</a>
    </p>
  </div>
</main>

<div id="hub-site-footer"></div>
<script src="/js/site-footer.js?v=20260910pp1" data-root="/"></script>
<script src="/js/partner-accept-terms.js?v=20260917terms1"></script>
</body>
</html>
