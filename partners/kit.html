<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting to partner hub…</title>
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.thenetworkeruk.com/partners/earnings">
<script>
(function () {
  var q = window.location.search || '';
  var h = window.location.hash || '';
  window.location.replace('/partners/earnings' + q + h);
})();
</script>
<meta http-equiv="refresh" content="0;url=/partners/earnings">
</head>
<body>
<p>Media kit now lives in your <a id="hub-link" href="/partners/earnings">partner hub</a> (earnings + creatives).</p>
<script>
(function () {
  var a = document.getElementById('hub-link');
  if (a) a.href = '/partners/earnings' + (window.location.search || '') + (window.location.hash || '');
})();
</script>
</body>
</html>
