<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Facebook · Group hosts</title>
<style>
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 500;
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 600;
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-style: normal;
    font-weight: 700;
    src: url('./fonts/dm-sans-700.woff2') format('woff2');
  }
  @font-face {
    font-family: 'DM Serif Display';
    font-style: normal;
    font-weight: 400;
    src: url('./fonts/dm-serif-display.woff2') format('woff2');
  }
  :root {
    --cream: #faf6ee;
    --lavender: #c299d1;
    --gold: #b8956a;
    --black: #0c0a0c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: #0c0a0c;
    font-family: 'DM Sans', system-ui, sans-serif;
  }
  #canvas {
    width: 1920px; height: 1080px;
    position: relative;
    overflow: hidden;
    color: var(--cream);
  }
  .photo {
    position: absolute;
    inset: 0;
    background: url('./facebook-group-hosts-bg.png') right center / cover no-repeat;
  }
  .veil {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, #0c0a0c 0%, rgba(12,10,12,0.96) 42%, rgba(12,10,12,0.55) 62%, rgba(12,10,12,0.12) 78%, transparent 100%),
      radial-gradient(ellipse 55% 70% at 18% 18%, rgba(194,153,209,0.22), transparent 58%);
  }
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 64px 80px 56px;
    display: flex;
    flex-direction: column;
    max-width: 1120px;
  }
  .logo {
    width: 280px;
    height: auto;
    margin-bottom: 48px;
  }
  h1 {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 72px;
    font-weight: 400;
    line-height: 1.08;
    letter-spacing: -0.02em;
    max-width: 900px;
    margin-bottom: 28px;
  }
  h1 em {
    font-style: normal;
    color: var(--lavender);
  }
  .sub {
    font-size: 28px;
    font-weight: 500;
    line-height: 1.4;
    color: rgba(250,246,238,0.78);
    max-width: 820px;
    margin-bottom: 16px;
  }
  .ask {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 32px;
    color: var(--lavender);
    margin-bottom: auto;
  }
  .rule {
    width: 520px;
    height: 1px;
    background: var(--gold);
    opacity: 0.85;
    margin: 36px 0 28px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 28px;
    font-size: 20px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 22px;
  }
  .chips span { white-space: nowrap; }
  .url {
    font-size: 18px;
    font-weight: 500;
    color: rgba(250,246,238,0.55);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
<div id="canvas">
  <div class="photo" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="content">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 132" role="img" aria-label="The Networker Hub">
      <text x="170" y="28" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">The</text>
      <text x="32" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">Net</text>
      <text x="119" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">w</text>
      <circle cx="176" cy="72" r="11" fill="#faf6ee" stroke="#c299d1" stroke-width="2.5"/>
      <circle cx="176" cy="72" r="17" fill="none" stroke="#c299d1" stroke-width="2"/>
      <text x="193" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">rker</text>
      <text x="170" y="124" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">Hub</text>
    </svg>
    <h1>Calling networking<br><em>group hosts</em></h1>
    <p class="sub">Locking in a few more rooms before our 1st September launch.</p>
    <p class="ask">Run a group? Know a host?</p>
    <div class="rule"></div>
    <div class="chips">
      <span>Free to list</span>
      <span>Keep 100% of ticket price</span>
      <span>Built for UK networking</span>
    </div>
    <p class="url">thenetworkerhub.com/for-organisers</p>
  </div>
</div>
</body>
</html>
