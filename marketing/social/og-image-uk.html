<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>UK Open Graph image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #111;
    display: flex; align-items: center; justify-content: center;
  }
  #canvas {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    flex-shrink: 0;
    padding: 56px 72px;
  }
  .logo {
    width: 820px;
    height: auto;
    display: block;
  }
  #canvas p {
    font-family: 'DM Sans', sans-serif;
    font-size: 32px;
    font-weight: 400;
    color: #d4c4e0;
    letter-spacing: 0.01em;
    text-align: center;
    line-height: 1.3;
    max-width: 920px;
  }
</style>
</head>
<body>
  <div id="canvas">
    <!-- Real wordmark (cream centre in the O) — not the SVG recreation -->
    <img class="logo" src="../../assets/logo-email-footer-navy.png" width="820" height="273" alt="The Networker UK">
    <p>Find your next event, organiser &amp; opportunity</p>
  </div>
</body>
</html>
