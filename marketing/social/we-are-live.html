<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>We're live · The Networker UK · 1080×1080</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background:
      radial-gradient(ellipse 75% 60% at 50% 32%, rgba(194, 153, 209, 0.22), transparent 65%),
      radial-gradient(ellipse 90% 70% at 50% 50%, #2a2430 0%, #1a1520 55%, #121018 100%);
    color: #faf6ee;
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 48px 48px;
    text-align: center;
    gap: 0;
  }

  .logo-wrap {
    width: 820px;
    max-width: 100%;
    margin-bottom: 36px;
    flex-shrink: 0;
  }

  .logo-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    max-width: 900px;
  }

  .headline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 88px;
    line-height: 1.05;
    font-weight: 400;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .sub {
    font-size: 30px;
    line-height: 1.35;
    font-weight: 600;
    color: #d9c4e0;
    max-width: 820px;
  }

  .pill {
    display: inline-block;
    margin-top: 4px;
    padding: 12px 28px;
    border-radius: 999px;
    background: rgba(184, 149, 106, 0.22);
    border: 2px solid rgba(184, 149, 106, 0.75);
    color: #f5e6cc;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .urls {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    font-size: 22px;
    letter-spacing: 0.03em;
    color: rgba(250, 246, 238, 0.62);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="canvas">
    <div class="logo-wrap" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 132" role="img" aria-label="The Networker UK">
        <text x="170" y="28" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">The</text>
        <text x="32" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">Net</text>
        <text x="119" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">w</text>
        <circle cx="176" cy="72" r="11" fill="#faf6ee" stroke="#c299d1" stroke-width="2.5"/>
        <circle cx="176" cy="72" r="17" fill="none" stroke="#c299d1" stroke-width="2"/>
        <text x="193" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">rker</text>
        <text x="170" y="124" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">UK</text>
      </svg>
    </div>
    <div class="copy">
      <h1 class="headline">We're live.</h1>
      <p class="sub">Browse events · book tickets · enquire on business opportunities</p>
      <p class="pill">Open from 9am today</p>
    </div>
    <p class="urls">thenetworkeruk.com</p>
  </div>
</body>
</html>
