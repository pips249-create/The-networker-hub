<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Facebook ad · Birmingham · 1080×1080</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', system-ui, sans-serif;
  }

  #canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background:
      radial-gradient(ellipse 85% 60% at 12% 8%, rgba(252, 211, 77, 0.35), transparent 55%),
      radial-gradient(ellipse 70% 55% at 88% 92%, rgba(184, 134, 11, 0.22), transparent 52%),
      radial-gradient(ellipse 55% 45% at 50% 100%, rgba(194, 153, 209, 0.12), transparent 50%),
      linear-gradient(165deg, #faf6ee 0%, #f8f2e6 42%, #f3ebe0 100%);
    color: #4a4446;
    display: flex;
    flex-direction: column;
    padding: 56px 64px 52px;
  }

  .brand {
    width: 280px;
    height: auto;
    margin-bottom: 40px;
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a6a20;
    margin-bottom: 20px;
  }

  .kicker-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #b8860b;
    flex-shrink: 0;
  }

  .headline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 72px;
    line-height: 1.04;
    letter-spacing: -0.025em;
    color: #2f2a2c;
    max-width: 920px;
    margin-bottom: 24px;
  }

  .headline em {
    font-style: normal;
    color: #9a7a10;
  }

  .sub {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.38;
    color: #5c5557;
    max-width: 820px;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
    color: #8a6a98;
    max-width: 780px;
  }

  .landmark-wrap {
    position: absolute;
    right: -24px;
    bottom: 120px;
    width: 420px;
    height: 420px;
    opacity: 0.14;
    pointer-events: none;
  }

  .landmark-wrap svg {
    width: 100%;
    height: 100%;
  }

  .footer {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 18px;
    position: relative;
    z-index: 1;
  }

  .cta {
    display: inline-flex;
    padding: 18px 34px;
    border-radius: 999px;
    background: linear-gradient(135deg, #b8860b 0%, #9a7209 100%);
    color: #fffdf8;
    font-size: 22px;
    font-weight: 700;
    box-shadow: 0 10px 28px rgba(154, 114, 9, 0.28);
  }

  .url {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #6a5020;
  }
</style>
</head>
<body>
  <div id="canvas" aria-label="The Networker UK — Birmingham Facebook ad">
    <img class="brand" src="../../assets/logo-nav-on-light.png?v=20260824tnuklight" alt="The Networker UK" width="280" height="112">

    <p class="kicker"><span class="kicker-dot" aria-hidden="true"></span> Birmingham · West Midlands</p>

    <h1 class="headline">Find your next <em>networking event</em>…</h1>

    <p class="sub">Breakfast clubs, exhibitions &amp; organiser groups across Birmingham and the wider Midlands.</p>
    <p class="tagline">Browse free on The Networker UK — book when you&apos;re ready.</p>

    <div class="landmark-wrap" aria-hidden="true">
      <svg viewBox="0 0 240 88" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#b8860b" stroke-linecap="round" stroke-linejoin="round">

        <path d="M84 44l-14 4 4 14 14-8M156 44l14 4-4 14-14-8"/>
        <path d="M88 36h64l4 14H84z"/>

        <circle cx="136" cy="58" r="4"/>

        <path d="M110 76v5M130 76v5" stroke-width="2"/>

        <path d="M120 83v-4"/>
      </svg>
    </div>

    <div class="footer">
      <div class="cta">Browse Birmingham events</div>
      <p class="url">thenetworkeruk.com/networking/birmingham</p>
    </div>
  </div>
</body>
</html>
