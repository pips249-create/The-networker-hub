<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Facebook ad · Birmingham · 1080×1080</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', system-ui, sans-serif;
  }

  #canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 15%, rgba(194, 153, 209, 0.32), transparent 55%),
      radial-gradient(ellipse 70% 55% at 85% 80%, rgba(184, 149, 106, 0.1), transparent 50%),
      linear-gradient(165deg, #2a2430 0%, #1a1520 45%, #121018 100%);
    color: #faf6ee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 72px;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(48px);
    opacity: 0.45;
    pointer-events: none;
  }

  .orb--1 {
    width: 380px;
    height: 380px;
    background: rgba(194, 153, 209, 0.4);
    top: -60px;
    left: -40px;
  }

  .orb--2 {
    width: 320px;
    height: 320px;
    background: rgba(154, 122, 168, 0.28);
    bottom: -20px;
    right: -30px;
  }

  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    max-width: 900px;
  }

  .brand {
    width: 720px;
    max-width: 92%;
    height: auto;
    display: block;
  }

  .headline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 76px;
    line-height: 1.06;
    letter-spacing: -0.02em;
    color: #faf6ee;
  }

  .headline .accent {
    color: #d9c4e0;
  }

  .sub {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.35;
    color: #c299d1;
    max-width: 720px;
  }
</style>
</head>
<body>
  <div id="canvas" aria-label="The Networker UK — Birmingham Facebook ad">
    <span class="orb orb--1" aria-hidden="true"></span>
    <span class="orb orb--2" aria-hidden="true"></span>

    <div class="content">
      <img class="brand" src="../../assets/logo-networker-uk-cover.png" alt="The Networker UK" width="720" height="380">

      <h1 class="headline">Find your next networking event<span class="accent">…</span></h1>

      <p class="sub">Birmingham &amp; the West Midlands · browse free</p>
    </div>
  </div>
</body>
</html>
