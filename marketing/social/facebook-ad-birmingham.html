<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Facebook ad · Birmingham · 1080×1080</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', system-ui, sans-serif;
  }

  #canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background:
      radial-gradient(ellipse 90% 70% at 50% 42%, rgba(74, 58, 88, 0.55), transparent 62%),
      radial-gradient(ellipse 55% 45% at 18% 12%, rgba(194, 153, 209, 0.22), transparent 55%),
      linear-gradient(180deg, #1e1824 0%, #141018 55%, #0c0a10 100%);
    color: #faf6ee;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .upper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 56px 0;
    flex: 0 0 auto;
  }

  .brand {
    width: 560px;
    max-width: 88%;
    height: auto;
    display: block;
    filter: drop-shadow(0 8px 28px rgba(194, 153, 209, 0.35));
    margin-bottom: 28px;
  }

  .headline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 68px;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: #faf6ee;
    max-width: 880px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
  }

  .headline .accent {
    color: #d9c4e0;
  }

  .lower {
    position: relative;
    z-index: 1;
    width: 100%;
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .skyline-glow {
    position: absolute;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    width: 920px;
    height: 200px;
    background: radial-gradient(ellipse 80% 70% at 50% 80%, rgba(194, 153, 209, 0.38), transparent 68%);
    pointer-events: none;
  }

  .skyline {
    width: 100%;
    max-width: 1040px;
    height: auto;
    display: block;
    margin: 0 auto -4px;
    filter: drop-shadow(0 0 36px rgba(194, 153, 209, 0.42)) drop-shadow(0 4px 20px rgba(184, 134, 11, 0.25));
  }

  .sub {
    position: relative;
    z-index: 2;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.02em;
    color: #c299d1;
    padding: 0 48px 52px;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>
  <div id="canvas" aria-label="The Networker UK — Birmingham Facebook ad">
    <div class="upper">
      <img class="brand" src="../../assets/logo-networker-uk-cover.png" alt="The Networker UK" width="560" height="296">
      <h1 class="headline">Find your next networking event<span class="accent">…</span></h1>
    </div>

    <div class="lower">
      <div class="skyline-glow" aria-hidden="true"></div>
      <img class="skyline" src="./birmingham-skyline-silhouette.svg" alt="" width="1080" height="260">
      <p class="sub">Birmingham &amp; the West Midlands · browse free</p>
    </div>
  </div>
</body>
</html>
