<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>International Open Graph image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #111;
    display: flex; align-items: center; justify-content: center;
  }
  #canvas {
    width: 1200px;
    height: 630px;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    flex-shrink: 0;
    padding: 48px 64px;
  }
  #canvas img {
    width: min(720px, 74%);
    height: auto;
    object-fit: contain;
  }
  #canvas p {
    font-family: 'DM Sans', sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: #c8b8d8;
    letter-spacing: 0.02em;
    text-align: center;
    line-height: 1.35;
    max-width: 900px;
  }
</style>
</head>
<body>
  <div id="canvas">
    <img src="../../assets/logo-networker-international.png" alt="The Networker International">
    <p>Trusted business networking, country by country</p>
  </div>
</body>
</html>
