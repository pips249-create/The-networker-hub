<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Going bigger · UK + International · 1080×1080</title>
<style>
  @font-face {
    font-family: 'DM Serif Display';
    src: url('./fonts/dm-serif-display.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-600.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #canvas {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 38%, rgba(194, 153, 209, 0.16), transparent 62%),
      radial-gradient(ellipse 90% 70% at 50% 50%, #2a2430 0%, #1a1520 55%, #121018 100%);
    color: #faf6ee;
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 72px 48px 52px;
    text-align: center;
  }

  .logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: 100%;
    max-width: 980px;
  }

  .logos img {
    display: block;
    width: 440px;
    max-width: 46%;
    height: auto;
    object-fit: contain;
    flex-shrink: 0;
  }

  .divider {
    width: 2px;
    height: 130px;
    background: rgba(250, 246, 238, 0.55);
    flex-shrink: 0;
  }

  .copy {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    max-width: 900px;
    flex: 1;
    justify-content: center;
  }

  .headline {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 68px;
    line-height: 1.08;
    font-weight: 400;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .sub {
    font-size: 26px;
    line-height: 1.35;
    font-weight: 600;
    color: #d9c4e0;
    max-width: 820px;
  }

  .urls {
    font-size: 18px;
    letter-spacing: 0.02em;
    color: rgba(250, 246, 238, 0.55);
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="canvas">
    <div class="logos">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 132" role="img" aria-label="The Networker UK">
        <text x="170" y="28" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">The</text>
        <text x="32" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">Net</text>
        <text x="119" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">w</text>
        <circle cx="176" cy="72" r="11" fill="#faf6ee" stroke="#c299d1" stroke-width="2.5"/>
        <circle cx="176" cy="72" r="17" fill="none" stroke="#c299d1" stroke-width="2"/>
        <text x="193" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">rker</text>
        <text x="170" y="124" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">UK</text>
      </svg>
      <div class="divider" aria-hidden="true"></div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 132" role="img" aria-label="The Networker International">
        <text x="170" y="28" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="26" fill="#f5f0e8">The</text>
        <text x="32" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">Net</text>
        <text x="119" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">w</text>
        <circle cx="176" cy="72" r="11" fill="#faf6ee" stroke="#c299d1" stroke-width="2.5"/>
        <circle cx="176" cy="72" r="17" fill="none" stroke="#c299d1" stroke-width="2"/>
        <text x="193" y="88" font-family="'DM Serif Display', Georgia, serif" font-size="58" fill="#c299d1">rker</text>
        <text x="170" y="124" text-anchor="middle" font-family="'DM Serif Display', Georgia, serif" font-size="22" fill="#f5f0e8">International</text>
      </svg>
    </div>
    <div class="copy">
      <h1 class="headline">We’re going bigger.</h1>
      <p class="sub">UK live. International next — worldwide opportunities as we grow.</p>
    </div>
    <p class="urls">thenetworkeruk.com · thenetworkerinternational.com</p>
  </div>
</body>
</html>
