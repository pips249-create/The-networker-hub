<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>International LinkedIn logo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #111;
    display: flex; align-items: center; justify-content: center;
  }
  #canvas {
    width: 1080px;
    height: 1080px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #canvas img {
    width: 78%;
    height: auto;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div id="canvas">
    <img src="../../assets/logo-networker-international.png" alt="The Networker International">
  </div>
</body>
</html>
