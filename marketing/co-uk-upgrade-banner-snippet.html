<!--
  WordPress paste snippet — The Networker co.uk upgrade banner
  CTA: https://www.thenetworkerhub.com/for-organisers
  Install: WPCode / Code Snippets → Header (frontend) → paste all three parts
-->

<!-- 1) HTML -->
<aside class="tnh-upgrade-banner" id="tnh-upgrade-banner" role="region" aria-label="Announcement">
  <div class="tnh-upgrade-banner__inner">
    <span class="tnh-upgrade-banner__eyebrow">Something new</span>
    <p class="tnh-upgrade-banner__copy">
      We&rsquo;ve been working on <em>The Networker Hub</em> — same team, new platform.
    </p>
    <a class="tnh-upgrade-banner__cta" href="https://www.thenetworkerhub.com/for-organisers" target="_blank" rel="noopener">
      Check it out <span aria-hidden="true">→</span>
    </a>
  </div>
  <button type="button" class="tnh-upgrade-banner__close" id="tnh-upgrade-banner-close" aria-label="Dismiss announcement">&times;</button>
</aside>

<!-- 2) CSS -->
<style>
.tnh-upgrade-banner {
  --tnh-ink: #1c2040;
  --tnh-cream: #f4f0ea;
  position: relative;
  z-index: 99999;
  background: linear-gradient(105deg, #1c2040 0%, #243056 48%, #1a4a6e 100%);
  color: #fff;
  font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
.tnh-upgrade-banner[hidden] { display: none !important; }
.tnh-upgrade-banner__inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 11px 44px 11px 18px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 10px 18px;
  text-align: center;
}
.tnh-upgrade-banner__eyebrow {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #b8d7ef;
  white-space: nowrap;
}
.tnh-upgrade-banner__copy {
  margin: 0;
  font-size: 15px;
  font-weight: 500;
  line-height: 1.35;
  color: #f5f7fb;
}
.tnh-upgrade-banner__copy em {
  font-style: normal;
  font-weight: 700;
  color: #fff;
}
.tnh-upgrade-banner__cta {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--tnh-cream);
  color: var(--tnh-ink) !important;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none !important;
  white-space: nowrap;
  transition: transform 0.15s ease, background 0.15s ease;
}
.tnh-upgrade-banner__cta:hover,
.tnh-upgrade-banner__cta:focus {
  background: #fff;
  color: var(--tnh-ink) !important;
  transform: translateY(-1px);
}
.tnh-upgrade-banner__close {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.75);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.tnh-upgrade-banner__close:hover,
.tnh-upgrade-banner__close:focus {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
}
@media (max-width: 640px) {
  .tnh-upgrade-banner__inner {
    padding: 12px 40px 12px 14px;
    gap: 8px;
  }
  .tnh-upgrade-banner__copy { font-size: 14px; }
  .tnh-upgrade-banner__eyebrow { width: 100%; }
}
</style>

<!-- 3) JS — remember dismiss for 14 days -->
<script>
(function () {
  var KEY = "tnh_upgrade_banner_dismissed_v1";
  var DAYS = 14;
  var el = document.getElementById("tnh-upgrade-banner");
  var btn = document.getElementById("tnh-upgrade-banner-close");
  if (!el) return;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var until = parseInt(raw, 10);
      if (until && Date.now() < until) {
        el.hidden = true;
        return;
      }
    }
  } catch (e) {}
  if (btn) {
    btn.addEventListener("click", function () {
      el.hidden = true;
      try {
        localStorage.setItem(KEY, String(Date.now() + DAYS * 24 * 60 * 60 * 1000));
      } catch (e) {}
    });
  }
})();
</script>
