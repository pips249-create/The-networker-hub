  <span class="tnh-upgrade-banner__glow tnh-upgrade-banner__glow--2" aria-hidden="true"></span>
  <div class="tnh-upgrade-banner__inner">
    <div class="tnh-upgrade-banner__col tnh-upgrade-banner__col--status">

    </div>
    <div class="tnh-upgrade-banner__col tnh-upgrade-banner__col--hero">
      <p class="tnh-upgrade-banner__headline">
        Find your next
        <span class="tnh-upgrade-banner__word" id="tnh-upgrade-banner-word" aria-live="polite">event</span>
      </p>
    </div>
    <div class="tnh-upgrade-banner__col tnh-upgrade-banner__col--cta">

<!-- 2) CSS -->
<style>
.tnh-upgrade-banner {
  --tnh-ink: #1a1030;
  --tnh-cream: #fff8ef;
  --tnh-gold: #ffe08a;
  position: relative;
  display: block;
  width: 100%;
  box-sizing: border-box;
  z-index: 100000;
  overflow: hidden;
  background: linear-gradient(105deg, #2a1848 0%, #6b3488 38%, #c48420 72%, #e8b45a 100%);
  color: #fff8ef;
  font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif;
}
.tnh-upgrade-banner[hidden] { display: none !important; }
.tnh-upgrade-banner__glow {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(2px);
  opacity: 0.85;
}
.tnh-upgrade-banner__glow--1 {
  width: 280px;
  height: 280px;
  top: -160px;
  left: -40px;
  background: radial-gradient(circle, rgba(255, 220, 140, 0.45) 0%, transparent 68%);
  animation: tnh-banner-drift 7s ease-in-out infinite alternate;
}
.tnh-upgrade-banner__glow--2 {
  width: 320px;
  height: 320px;
  top: -180px;
  right: -60px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, transparent 70%);
  animation: tnh-banner-drift 9s ease-in-out infinite alternate-reverse;
}
@keyframes tnh-banner-drift {
  from { transform: translate(0, 0); }
  to { transform: translate(18px, 10px); }
}
.tnh-upgrade-banner__inner {
  position: relative;
  max-width: 1120px;
  margin: 0 auto;
  padding: 16px 52px 16px 20px;
  display: grid;
  grid-template-columns: minmax(140px, 0.9fr) minmax(220px, 1.6fr) auto;
  align-items: center;
  gap: 12px 28px;
}
.tnh-upgrade-banner__col--status {
  min-width: 0;
}
.tnh-upgrade-banner__status {
  margin: 0;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 248, 239, 0.88);
}
.tnh-upgrade-banner__date {
  margin: 4px 0 0;
  font-size: clamp(0.92rem, 1.7vw, 1.05rem);
  font-weight: 700;
  line-height: 1.25;
  color: #fffdf8;
  letter-spacing: -0.015em;
}
.tnh-upgrade-banner__date strong {
  color: var(--tnh-gold);
  font-weight: 800;
}
.tnh-upgrade-banner__col--hero {
  min-width: 0;
  text-align: center;
}
.tnh-upgrade-banner__headline {
  margin: 0;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: clamp(1.45rem, 3.2vw, 2rem);
  font-weight: 400;
  line-height: 1.12;
  color: #fffdf8;
  letter-spacing: -0.025em;
  text-shadow: 0 2px 18px rgba(26, 16, 48, 0.25);
}
.tnh-upgrade-banner__word {
  display: inline-block;
  min-width: 7.5ch;
  color: var(--tnh-gold);
  font-style: italic;
  text-align: left;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.tnh-upgrade-banner__word.is-fading {
  opacity: 0;
  transform: translateY(5px);
}
.tnh-upgrade-banner__col--cta {
  justify-self: end;
}
.tnh-upgrade-banner__cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border-radius: 999px;
  background: #fff8ef;
  color: #1a1030 !important;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.01em;
  text-decoration: none !important;
  white-space: nowrap;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.35),
    0 10px 28px rgba(26, 16, 48, 0.28);
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  animation: tnh-banner-cta-pulse 2.8s ease-in-out infinite;
}
.tnh-upgrade-banner__cta:hover,
.tnh-upgrade-banner__cta:focus {
  background: #ffe08a;
  color: #1a1030 !important;
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 14px 32px rgba(26, 16, 48, 0.35);
  animation: none;
}
@keyframes tnh-banner-cta-pulse {
  0%, 100% { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35), 0 10px 28px rgba(26, 16, 48, 0.28); }
  50% { box-shadow: 0 0 0 4px rgba(255, 224, 138, 0.35), 0 12px 30px rgba(26, 16, 48, 0.32); }
}
.tnh-upgrade-banner__close {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  color: rgba(255, 248, 239, 0.9);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}
.tnh-upgrade-banner__close:hover,
.tnh-upgrade-banner__close:focus {
  color: #1a1030;
  background: #fff8ef;
}
@media (max-width: 820px) {
  .tnh-upgrade-banner__inner {
    grid-template-columns: 1fr auto;
    grid-template-areas:
      "status cta"
      "hero hero";
    padding: 16px 46px 16px 18px;
    gap: 10px 16px;
  }
  .tnh-upgrade-banner__col--status { grid-area: status; }
  .tnh-upgrade-banner__col--hero {
    grid-area: hero;
    text-align: left;
  }
  .tnh-upgrade-banner__col--cta {
    grid-area: cta;
    justify-self: end;
    align-self: center;
  }
}
@media (max-width: 520px) {
  .tnh-upgrade-banner__inner {
    grid-template-columns: 1fr;
    grid-template-areas:
      "status"
      "hero"
      "cta";
  }
  .tnh-upgrade-banner__col--cta { justify-self: start; }
  .tnh-upgrade-banner__word { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .tnh-upgrade-banner__glow,
  .tnh-upgrade-banner__cta,
  .tnh-upgrade-banner__word { animation: none; transition: none; }
}
</style>

<!-- 3) JS — rotate words + dismiss 7 days -->
<script>
(function () {
  var KEY = "tnh_upgrade_banner_dismissed_v12";
  var DAYS = 7;
  var WORDS = ["event", "opportunity", "group", "attendee", "connection"];
  var el = document.getElementById("tnh-upgrade-banner");
  var btn = document.getElementById("tnh-upgrade-banner-close");
  var word = document.getElementById("tnh-upgrade-banner-word");
  if (!el) return;

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var until = parseInt(raw, 10);
      if (until && Date.now() < until) {
        el.hidden = true;
        return;
      }
    }
  } catch (e) {}

  if (btn) {
    btn.addEventListener("click", function () {
      el.hidden = true;
      try {
        localStorage.setItem(KEY, String(Date.now() + DAYS * 24 * 60 * 60 * 1000));
      } catch (e) {}
    });
  }

  if (!word || !WORDS.length) return;
  var reduce = false;
  try {
    reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  } catch (e) {}
  if (reduce) {
    word.textContent = WORDS.join(", ");
    word.classList.remove("is-fading");
    return;
  }
  var i = 0;
  word.textContent = WORDS[0];
  window.setInterval(function () {
    i = (i + 1) % WORDS.length;
    word.classList.add("is-fading");
    window.setTimeout(function () {
      word.textContent = WORDS[i];
      word.classList.remove("is-fading");
    }, 180);
  }, 3200);
})();
</script>
